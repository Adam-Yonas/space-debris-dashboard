<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Debris Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <main id="app">
    <h1>Space Debris Dashboard</h1>
    <p class="subtitle">
      3D orbit visualization with altitude, inclination, eccentricity, and mission-duration-based risk assessment.
    </p>

    <section class="controls">
      <div class="control-group">
        <label for="altitudeInput">Proposed orbit altitude (km)</label>
        <input id="altitudeInput" type="number" v-model.number="form.altitude_km" />
      </div>

      <div class="control-group">
        <label for="inclinationInput">Proposed inclination (deg)</label>
        <input id="inclinationInput" type="number" v-model.number="form.inclination_deg" />
      </div>

      <div class="control-group">
        <label for="eccentricityInput">Proposed eccentricity</label>
        <input id="eccentricityInput" type="number" step="0.001" v-model.number="form.eccentricity" />
      </div>

      <div class="control-group">
        <label for="durationInput">Mission duration (years)</label>
        <input id="durationInput" type="number" step="0.1" v-model.number="form.mission_years" />
      </div>

      <div class="control-group">
        <button @click="assessOrbit" :disabled="loading">
          {{ loading ? "Assessing..." : "Assess Orbit" }}
        </button>
      </div>
    </section>

    <section class="advanced-panel">
      <details>
        <summary>Advanced Options</summary>
        <div class="advanced-grid">
          <div class="control-group">
            <label for="raanInput">RAAN (deg)</label>
            <input id="raanInput" type="number" v-model.number="form.raan_deg" />
          </div>
        </div>
      </details>
    </section>

    <section class="results">
      <h2>Orbit Assessment</h2>
      <p v-if="error" style="color: #ff9b9b;">{{ error }}</p>
      <p v-if="!assessment && !error">Enter orbit parameters, then click "Assess Orbit."</p>

      <template v-if="assessment">
        <p>{{ selectedOrbitText }}</p>
        <p>{{ riskScoreText }}</p>
        <p>{{ riskLevelText }}</p>
        <p>{{ matchingObjectsText }}</p>
        <p>{{ missionExposureText }}</p>
        <p>{{ recommendationText }}</p>
      </template>
    </section>

    <section class="chart-section">
      <div id="orbit3d"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
